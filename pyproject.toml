[project]
name = "nu-pdf-finance"
version = "1.0.0"
description = "Le faturas do cartao Nubank em PDF e alimenta a aba Cartao da planilha de planejamento."
requires-python = ">=3.10"
dependencies = [
    "pdfplumber>=0.11",
    "openpyxl>=3.1",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 88

[tool.black]
line-length = 88
