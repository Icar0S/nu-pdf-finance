# Tabela de merchants -> categoria. Versionada no git de proposito: e o unico
# lugar onde mora opiniao sobre em que balde cada gasto cai, e voce quer ver a
# mudanca no diff quando reclassificar o historico.
#
# As chaves sao a descricao NORMALIZADA: minuscula, sem acento, sem o sufixo do
# cartao (•••• 5449), sem o sufixo de parcela, com o '*' dos agregadores
# colapsado ('Shopee *Utilshome' -> 'shopee*utilshome').
#
# Merchant que nao casa aqui nem em 'padroes' fica PENDENTE e trava o export
# ate voce rodar `python -m nubank review`. Isso e intencional.

# Categoria -> coluna da aba Cartao da planilha.
#   parcelas  = coluna C (Parcelas e assinaturas)
#   essencial = coluna D (mercado, farmacia, transporte)
#   superfluo = coluna E (delivery, compras, saidas)
categorias:
  assinatura: parcelas

  mercado: essencial
  padaria: essencial
  farmacia: essencial
  transporte: essencial
  saude: essencial
  contas: essencial
  educacao: essencial
  pet: essencial

  delivery: superfluo
  restaurante: superfluo
  compras: superfluo
  lazer: superfluo
  vestuario: superfluo
  presentes: superfluo

# Prefixos de agregador. Servem para o merchant novo que ja nasce dentro de um
# marketplace conhecido: um restaurante inedito no iFood e delivery sem que
# voce precise aprovar cada um. Testados do mais longo para o mais curto.
padroes:
  - prefixo: "ifd*"
    categoria: delivery
  - prefixo: "shopee*"
    categoria: compras
  - prefixo: "amazonmktplc*"
    categoria: compras

